name: Scrape Coffee Prices

on:
  schedule:
    # Chạy mỗi ngày lúc 8:00 AM (UTC+7 = 1:00 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # Cho phép chạy thủ công

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        playwright install chromium
        playwright install-deps
    
    - name: Run scraper and send to API
      env:
        APPS_SCRIPT_URL: ${{ secrets.APPS_SCRIPT_URL }}
      run: |
        echo "Thử phương pháp 1: Playwright..."
        python scraper_to_sheets.py || echo "Playwright failed, trying simple method..."
        
        if [ ! -f coffee_prices_latest.json ]; then
          echo "Thử phương pháp 2: Simple requests..."
          python scraper_simple.py
          
          if [ -f coffee_prices_latest.json ] && [ -n "$APPS_SCRIPT_URL" ]; then
            echo "Gửi dữ liệu lên Google Sheets..."
            python -c "
import requests
import json

with open('coffee_prices_latest.json', 'r', encoding='utf-8') as f:
    data = json.load(f)

response = requests.post(
    '$APPS_SCRIPT_URL',
    json=data,
    headers={'Content-Type': 'application/json'},
    timeout=30
)
print(f'Response: {response.status_code}')
print(response.text)
            "
          fi
        fi
      shell: bash
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: coffee-prices
        path: coffee_prices_*.json
        retention-days: 30
      if: success()
    
    - name: Upload debug files
      uses: actions/upload-artifact@v4
      with:
        name: debug-files
        path: |
          debug_*.html
          debug_*.png
        retention-days: 7
      if: failure()
    
    # Optional: Commit kết quả vào repo
    - name: Commit results
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add coffee_prices_*.json
        git diff --quiet && git diff --staged --quiet || git commit -m "Update coffee prices $(date +'%Y-%m-%d %H:%M:%S')"
        git push
      continue-on-error: true
